suite: worker-beat deployment
templates:
  - templates/worker-beat-deployment.yaml
  - templates/invenio-configmap.yaml
release:
  name: test
set:
  invenio.hostname: "test.example.com"
  rabbitmq.auth.password: "test"
  postgresql.auth.password: "test"
tests:
  - it: renders a Deployment with correct component label
    asserts:
      - isKind:
          of: Deployment
        template: templates/worker-beat-deployment.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: worker-beat
        template: templates/worker-beat-deployment.yaml

  - it: always has replicas 1
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        template: templates/worker-beat-deployment.yaml

  - it: adds nodeSelector when set
    set:
      workerBeat.nodeSelector:
        node-role: worker-beat
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            node-role: worker-beat
        template: templates/worker-beat-deployment.yaml

  - it: adds tolerations when set
    set:
      workerBeat.tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "worker-beat"
          effect: "NoSchedule"
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
        template: templates/worker-beat-deployment.yaml

  - it: adds pod annotations when set
    set:
      workerBeat.podAnnotations:
        prometheus.io/scrape: "true"
    asserts:
      - exists:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
        template: templates/worker-beat-deployment.yaml

  - it: adds affinity when set
    set:
      workerBeat.affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - worker-beat
                topologyKey: kubernetes.io/hostname
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
        template: templates/worker-beat-deployment.yaml
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
        template: templates/worker-beat-deployment.yaml

  - it: adds extra env vars
    set:
      workerBeat.extraEnvVars:
        - name: MY_VAR
          value: my-value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_VAR
            value: my-value
        template: templates/worker-beat-deployment.yaml

  - it: uses the default celery beat command when commandOverride is unset
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/bash
            - -c
            - "celery -A invenio_app.celery beat -l INFO -s /var/run/celery/celery-schedule --pidfile /var/run/celery/celerybeat.pid"
        template: templates/worker-beat-deployment.yaml

  - it: uses commandOverride as the container command when set
    set:
      workerBeat.commandOverride: "celery -A invenio_app.celery worker --beat --loglevel=INFO"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/bash
            - -c
            - "celery -A invenio_app.celery worker --beat --loglevel=INFO"
        template: templates/worker-beat-deployment.yaml

  - it: templates values referenced inside commandOverride
    set:
      worker.app: my_app.celery
      worker.log_level: DEBUG
      workerBeat.commandOverride: "celery -A {{ .Values.worker.app }} worker --beat --loglevel={{ .Values.worker.log_level }}"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/bash
            - -c
            - "celery -A my_app.celery worker --beat --loglevel=DEBUG"
        template: templates/worker-beat-deployment.yaml
