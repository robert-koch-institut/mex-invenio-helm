suite: worker-scheduler deployment
templates:
  - templates/worker-scheduler-deployment.yaml
  - templates/invenio-configmap.yaml
release:
  name: test
set:
  invenio.hostname: "test.example.com"
  rabbitmq.auth.password: "test"
  postgresql.auth.password: "test"
tests:
  - it: renders a Deployment with correct component label when enabled
    asserts:
      - isKind:
          of: Deployment
        template: templates/worker-scheduler-deployment.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: worker-scheduler
        template: templates/worker-scheduler-deployment.yaml

  - it: renders nothing when disabled
    set:
      workerScheduler.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/worker-scheduler-deployment.yaml

  - it: always has replicas 1
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        template: templates/worker-scheduler-deployment.yaml

  - it: uses the default RunScheduler command when commandOverride is unset
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/bash
            - -c
            - "celery -A invenio_app.celery beat --scheduler invenio_jobs.services.scheduler:RunScheduler -l INFO"
        template: templates/worker-scheduler-deployment.yaml

  - it: uses the configured scheduler class in the default command
    set:
      workerScheduler.class: "custom_module.CustomScheduler"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/bash
            - -c
            - "celery -A invenio_app.celery beat --scheduler custom_module.CustomScheduler -l INFO"
        template: templates/worker-scheduler-deployment.yaml

  - it: uses commandOverride as the container command when set
    set:
      workerScheduler.commandOverride: "celery -A invenio_app.celery beat --scheduler invenio_jobs.services.scheduler:RunScheduler --loglevel=DEBUG"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/bash
            - -c
            - "celery -A invenio_app.celery beat --scheduler invenio_jobs.services.scheduler:RunScheduler --loglevel=DEBUG"
        template: templates/worker-scheduler-deployment.yaml

  - it: templates values referenced inside commandOverride
    set:
      worker.app: my_app.celery
      workerScheduler.class: custom_module.CustomScheduler
      workerScheduler.commandOverride: "celery -A {{ .Values.worker.app }} beat --scheduler {{ .Values.workerScheduler.class }} --loglevel=DEBUG"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/bash
            - -c
            - "celery -A my_app.celery beat --scheduler custom_module.CustomScheduler --loglevel=DEBUG"
        template: templates/worker-scheduler-deployment.yaml

  - it: adds affinity when set
    set:
      workerScheduler.affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - worker-scheduler
                topologyKey: kubernetes.io/hostname
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
        template: templates/worker-scheduler-deployment.yaml
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
        template: templates/worker-scheduler-deployment.yaml

  - it: adds nodeSelector when set
    set:
      workerScheduler.nodeSelector:
        node-role: worker-scheduler
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            node-role: worker-scheduler
        template: templates/worker-scheduler-deployment.yaml

  - it: adds tolerations when set
    set:
      workerScheduler.tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "worker-scheduler"
          effect: "NoSchedule"
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
        template: templates/worker-scheduler-deployment.yaml

  - it: adds pod annotations when set
    set:
      workerScheduler.podAnnotations:
        prometheus.io/scrape: "true"
    asserts:
      - exists:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
        template: templates/worker-scheduler-deployment.yaml

  - it: adds extra env vars
    set:
      workerScheduler.extraEnvVars:
        - name: MY_VAR
          value: my-value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_VAR
            value: my-value
        template: templates/worker-scheduler-deployment.yaml

  - it: adds deployment annotations when set
    set:
      workerScheduler.deployment.annotations:
        custom-annotation: "test"
    asserts:
      - equal:
          path: metadata.annotations["custom-annotation"]
          value: "test"
        template: templates/worker-scheduler-deployment.yaml
