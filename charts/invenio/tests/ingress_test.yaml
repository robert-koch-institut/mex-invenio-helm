suite: ingress
templates:
  - templates/ingress.yaml
release:
  name: test
set:
  invenio.hostname: "test.example.com"
  rabbitmq.auth.password: "test"
  postgresql.auth.password: "test"
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an Ingress when enabled
    set:
      ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress

  - it: sets ingressClassName when class is specified
    set:
      ingress.enabled: true
      ingress.class: nginx
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: adds annotations when specified
    set:
      ingress.enabled: true
      ingress.annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-body-size"]
          value: "0"

  - it: sets the correct host
    set:
      ingress.enabled: true
    asserts:
      - equal:
          path: spec.rules[0].host
          value: test.example.com

  - it: renders no public Ingress without publicPaths
    set:
      ingress.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: serves publicPaths through a second Ingress without the main annotations
    set:
      ingress.enabled: true
      ingress.class: nginx
      ingress.annotations:
        nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.1/32"
      ingress.publicPaths:
        - /import-status.json
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: test-invenio-public
        documentIndex: 1
      - notExists:
          path: metadata.annotations
        documentIndex: 1
      - equal:
          path: spec.ingressClassName
          value: nginx
        documentIndex: 1
      - equal:
          path: spec.rules[0].host
          value: test.example.com
        documentIndex: 1
      - equal:
          path: spec.rules[0].http.paths
          value:
            - path: /import-status.json
              pathType: Exact
              backend:
                service:
                  name: test-invenio-web
                  port:
                    name: http
        documentIndex: 1
      - equal:
          path: spec.tls[0].hosts[0]
          value: test.example.com
        documentIndex: 1
