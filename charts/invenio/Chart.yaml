apiVersion: v2
name: invenio
appVersion: 13.1.2
description: Turn-key research data management platform.
home: https://inveniosoftware.org/
icon: https://inveniosoftware.org/static/img/logo-invenio-white.svg
sources:
  - https://github.com/inveniosoftware/invenio-app-rdm
keywords:
  - digital-repository
  - institutional-repository
  - multimedia-library
  - multimedia-repository
type: application
version: 0.14.0
maintainers:
  - name: CERN
    email: info@inveniosoftware.org
dependencies:
  - name: opensearch
    condition: opensearch.enabled
    repository: https://opensearch-project.github.io/helm-charts
    version: "2.30.1"   # OpenSearch version 2.18.0, same as the bitnami 14.3.3 previously used
  # - name: postgres  # Note bitnami had name postgresql
  #   condition: postgresql.enabled  # Keep your existing condition
  #   repository: "oci://registry-1.docker.io/cloudpirates"
  #   version: "0.5.0"  # PostgreSQL 17.6 (upgrade from 16.2.0)
  - name: rabbitmq
    condition: rabbitmq.enabled
    repository: "oci://registry-1.docker.io/bitnamicharts"
    version: "12.9.3"
  - name: redis
    condition: redis.enabled
    repository: "oci://registry-1.docker.io/bitnamicharts"
    version: "18.12.0"