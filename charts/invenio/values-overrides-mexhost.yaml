### Template overrides for running MEx on the Gardener-managed Kubernetes cluster running on OpenStack

# Temporarily required for the bitnamilegacy images
global:
  security:
    allowInsecureImages: true

invenio:
  init: false  # initiates db, index, and admin roles. set false post-install.
  hostname: "mex-stage.rki.de"
  default_users:
    mex@rki.de: "<placeholder>"
  existingSecret: "mex-invenio-secrets"
  extraConfig:
    INVENIO_SETTINGS_MODULE: "mex_invenio.config"
    # MEX import secrets now pulled from mex-invenio-secrets:
    # MEX_IMPORT_ENDPOINT_URL, MEX_IMPORT_AWS_KEY_ID, MEX_IMPORT_AWS_SECRET, 
    # MEX_IMPORT_BUCKET, MEX_IMPORT_EMAIL
    # INVENIO_MAIL_SERVER: "sandbox.smtp.mailtrap.io"
    # INVENIO_MAIL_PORT: "2525"
    # INVENIO_MAIL_USERNAME: "REPLACE-ME"
    # INVENIO_MAIL_PASSWORD: "REPLACE-ME"
    # INVENIO_MAIL_USE_SSL: "False"
    # INVENIO_MAIL_USE_TLS: "True"
  datacite:
    enabled: false

web:
  image: "ghcr.io/robert-koch-institut/mex-invenio:4ce74810d3d1b5b3713c25d52dea6e828c48541d"
  imagePullPolicy: Always
  loadBalancerIP: "<placeholder>"
  annotations:
    loadbalancer.openstack.org/keep-floatingip: "true"
    #loadbalancer.openstack.org/proxy-protocol: "false"
    loadbalancer.openstack.org/load-balancer-address: "<placeholder>"
    loadbalancer.openstack.org/hostname: "mex-stage.rki.de"
    # LoadBalancer timeout configuration for slow MEX record pages (5 minutes)
    loadbalancer.openstack.org/timeout-client-data: "300000"
    loadbalancer.openstack.org/timeout-member-connect: "60000"
    loadbalancer.openstack.org/timeout-member-data: "300000"
    loadbalancer.openstack.org/timeout-tcp-inspect: "60000"
  replicas: 4
  readinessProbe:
    failureThreshold: 5
    initialDelaySeconds: 10
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 1
  startupProbe:
    failureThreshold: 5
    initialDelaySeconds: 15
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10

# We want a high number of worker replicas to handle MEX import
worker:
  image: "ghcr.io/robert-koch-institut/mex-invenio:4ce74810d3d1b5b3713c25d52dea6e828c48541d"
  imagePullPolicy: Always
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

importjob:
  enabled: true
  imagePullPolicy: Always
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    size: 25Gi

postgresql:
  enabled: false

# Provide these using --set argument, after pulling the secrets down from the vault:
postgresqlExternal: 
  hostname: "<placeholder>"
  port: 5432
  username: "<placeholder>"
  password: "<placeholder>"
  databaseName: "<placeholder>"

opensearch:
  enabled: true
  # Naming: Use pattern <release-name>-opensearch for consistency
  # For release "mex-invenio", this creates services: mex-invenio-opensearch-master
  clusterName: mex-invenio-opensearch
  nodeGroup: master
  masterService: mex-invenio-opensearch-master
  persistence:
    size: 8Gi
  # Increased heap size for better search performance
  # Setting heap to 2GB (50% of 4GB memory limit)
  opensearchJavaOpts: "-Xms2g -Xmx2g"
  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  # Security disabled, equivalent to bitnami charts - TODO: Enable with proper auth mechanism
  # extraEnvs:
  #   - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
  #     valueFrom:
  #       secretKeyRef:
  #         name: mex-invenio-secrets
  #         key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
  config:
    opensearch.yml: |
      cluster.name: mex-invenio-opensearch
      network.host: 0.0.0.0
      plugins:
        security:
          disabled: true

rabbitmq:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: "1"
      memory: 2Gi
  persistence:
    size: 8Gi
  extraConfiguration: |
    # Increase consumer timeout to 2 hours (7200000 ms) for long-running MEX import tasks
    # Default in RabbitMQ 4.x is 30 minutes (1800000 ms)
    # This prevents "PRECONDITION_FAILED - delivery acknowledgement timed out" errors
    consumer_timeout = 7200000
  # rabbitmq.auth.password: provide via --set argument, after pulling the secret down from the vault

redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.2.4-debian-12-r9

haproxy:
  enabled: false

flower:
  enabled: false

persistence:
  enabled: false
  storage_class: "csi-cinder-sc-retain"
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"

ingress:
  enabled: true
  class: "nginx"
  tlsSecretNameOverride: stage-tls
  annotations:
    kubernetes.io/ingress.class: "nginx"
    #cert-manager.io/cluster-issuer: "letsencrypt-production"
    #cert-manager.io/issue-temporary-certificate: "true"
    #acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50G"
    nginx.ingress.kubernetes.io/whitelist-source-range: "<placeholder>"
    # Nginx timeout configuration for slow MEX record pages (5 minutes)
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

clusterissuer:
  email: "mex@rki.de"
