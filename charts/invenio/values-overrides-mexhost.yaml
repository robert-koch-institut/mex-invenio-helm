invenio:
  init: true  # initiates db, index, and admin roles
  #hostname: "stage.429354.projects.prod.gardener.get-cloud.io"
  hostname: "mex-stage.rki.de"
  default_users:
    steve@cottagelabs.com: "testing"
    hrafn@cottagelabs.com: "testing"
  secret_key: "<placeholder>"
  security_login_salt: "<placeholder>"
  csrf_secret_salt: "<placeholder>"
  create_fixtures: true
  extraConfig:
    INVENIO_SETTINGS_MODULE: "mex_invenio.config"
    MEX_IMPORT_ENDPOINT_URL: "<placeholder>"
    MEX_IMPORT_AWS_KEY_ID: "<placeholder>"
    MEX_IMPORT_AWS_SECRET: "<placeholder>"
    MEX_IMPORT_BUCKET: "<placeholder>"
    MEX_IMPORT_OBJECT_KEY: "publisher.ndjson"
    MEX_IMPORT_EMAIL: "<placeholder>"
  #  INVENIO_MAIL_SERVER: "sandbox.smtp.mailtrap.io"
  #  INVENIO_MAIL_PORT: "2525"
  #  INVENIO_MAIL_USERNAME: "REPLACE-ME"
  #  INVENIO_MAIL_PASSWORD: "REPLACE-ME"
  #  INVENIO_MAIL_USE_SSL: "False"
  #  INVENIO_MAIL_USE_TLS: "True"
  datacite:
    enabled: false

web:
  image: "ghcr.io/robert-koch-institut/mex-invenio:cd361801f3988d441899e58fadf0f72bbb43b302"
  imagePullPolicy: Always
  annotations:
    loadbalancer.openstack.org/keep-floatingip: "true"
    #loadbalancer.openstack.org/proxy-protocol: "false"
    loadbalancer.openstack.org/load-balancer-address: "78.138.70.40"
    loadbalancer.openstack.org/hostname: "mex-stage.rki.de"
  replicas: 5
  readinessProbe:
    failureThreshold: 5
    initialDelaySeconds: 10
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 1
  startupProbe:
    failureThreshold: 5
    initialDelaySeconds: 15
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10

worker:
  image: "ghcr.io/robert-koch-institut/mex-invenio:cd361801f3988d441899e58fadf0f72bbb43b302"
  imagePullPolicy: Always
  replicas: 1

importjob:
  enabled: true
  imagePullPolicy: Always
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

# FIXME: temporarily re-enable the containerised sql until our host provides a postrgres 
postgresql:
  enabled: true

# postgresqlExternal: 
#   hostname: "<placeholder>"
#   port: 5432
#   username: "<placeholder>"
#   password: "<placeholder>"
#   databaseName: invenio

haproxy:
  enabled: false

flower:
  enabled: false

persistence:
  enabled: false
  storage_class: "csi-cinder-sc-retain"
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"

ingress:
  enabled: true
  class: "nginx"
  tlsSecretNameOverride: stage-tls
  annotations:
    kubernetes.io/ingress.class: "nginx"
    #cert-manager.io/cluster-issuer: "letsencrypt-production"
    #cert-manager.io/issue-temporary-certificate: "true"
    #acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50G"
    # IP whitelist:                                      steve            aga              hrafn           hrafn2          Richard          RKI             RKI
    nginx.ingress.kubernetes.io/whitelist-source-range: "77.98.243.228/32,146.90.80.159/32,82.37.113.44/32,86.129.227.2/32,78.144.22.157/32,77.87.228.64/29,77.87.224.97/29"

clusterissuer:
  email: "sysadmin+mex@cottagelabs.com"
