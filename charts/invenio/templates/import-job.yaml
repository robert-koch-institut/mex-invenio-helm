{{- if .Values.importjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "invenio.fullname" . }}-import-job
  labels:
    {{- include "invenio.labels" . | nindent 4 }}
spec:
  schedule: "0 5 * * *"
  suspend: {{ .Values.importjob.suspend | default false }}
  concurrencyPolicy: Forbid
  # Failed runs are kept so the reason can be seen with kubectl; finished Jobs
  # are cleaned up by these limits rather than a TTL, which removed failed ones too.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retries: a retry re-runs the whole sync, and the importer records a
      # failed or interrupted import in .import_state, which blocks re-runs anyway.
      backoffLimit: 0
      template:
        spec:
          containers:
          - name: import-job
            image: {{ include "invenio.image" . }}
            imagePullPolicy: Always
            command: [
              "invenio",
              "shell",
              "/opt/invenio/src/site/mex_invenio/scripts/s3_manager.py"
            ]
            envFrom:
            - configMapRef:
                name: {{ include "invenio.fullname" . }}-config
            - secretRef:
                name: {{ include "invenio.secretName" . }}
            env:
            - name: TZ
              value: {{ required "Missing .Values.global.timezone" .Values.global.timezone }}
            {{- include "invenio.config.queue" . | nindent 12 }}
            {{- include "invenio.config.database" . | nindent 12 }}
            {{- include "invenio.opensearch.env" . | nindent 12 }}
            - name: INVENIO_S3_DOWNLOAD_FOLDER
              value: {{ .Values.importjob.persistence.mountPath | quote }}
            {{- if .Values.importjob.persistence.enabled }}
            - name: INVENIO_IMPORT_STATUS_DIR
              value: {{ .Values.importjob.persistence.mountPath }}/status
            - name: INVENIO_DOWNLOADABLE_FILES_DIR
              value: {{ .Values.importjob.persistence.mountPath }}/downloadable_files
            {{- end }}
            {{- include "invenio.config.sentry" . | nindent 12 }}
            {{- if .Values.importjob.persistence.enabled }}
            volumeMounts:
            - name: import-data
              mountPath: {{ .Values.importjob.persistence.mountPath }}
            {{- end }}
            {{- if .Values.importjob.resources }}
            resources: {{- toYaml .Values.importjob.resources | nindent 14 }}
            {{- end }}
          {{- if .Values.importjob.persistence.enabled }}
          volumes:
          - name: import-data
            persistentVolumeClaim:
              claimName: {{ include "invenio.fullname" . }}-import-data
          {{- end }}
          restartPolicy: Never
          {{- if .Values.web.imagePullSecret }}
          imagePullSecrets:
          - name: {{ .Values.web.imagePullSecret }}
          {{- end }}
{{- end }}