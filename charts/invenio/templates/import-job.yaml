{{- if .Values.importjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "invenio.fullname" . }}-import-job
  labels:
    {{- include "invenio.labels" . | nindent 4 }}
spec:
  schedule: "0 5 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: import-job
            image: {{ required "Missing .Values.web.image" .Values.web.image }}
            imagePullPolicy: Always
            command: [
              "invenio",
              "shell",
              "/opt/invenio/src/site/mex_invenio/scripts/s3_manager.py",
              "--",
              "--",
              "--ingest"
            ]
            envFrom:
            - configMapRef:
                name: {{ include "invenio.fullname" . }}-config
            - secretRef:
                name: {{ include "invenio.secretName" . }}
            env:
            - name: TZ
              value: {{ required "Missing .Values.global.timezone" .Values.global.timezone }}
            - name: INVENIO_BROKER_URL
              value: {{ include "invenio.rabbitmq.uri" . }}
            - name: INVENIO_CELERY_BROKER_URL
              value: {{ include "invenio.rabbitmq.uri" . }}
            - name: INVENIO_SQLALCHEMY_DATABASE_URI
              value: {{ include "invenio.sqlAlchemyDbUri" . }}
            volumeMounts:
              {{- range $key, $value := .Values.invenio.vocabularies }}
              - name: vocabularies
                mountPath: "/opt/invenio/var/instance/app_data/vocabularies/{{ $key }}"
                subPath: "{{ $key }}"
              {{- end }}
            {{- include "invenio.config.sentry" . | nindent 12 }}
            {{- if .Values.importjob.resources }}
            resources: {{- toYaml .Values.importjob.resources | nindent 14 }}
            {{- end }}
          restartPolicy: OnFailure
          {{- if .Values.invenio.vocabularies }}
          volumes:
            - name: vocabularies
              configMap:
                name: "{{ include "invenio.fullname" . }}-vocabularies"
          {{- end }}
          {{- if .Values.web.imagePullSecret }}
          imagePullSecrets:
          - name: {{ .Values.web.imagePullSecret }}
          {{- end }}
{{- end }}