{{- if .Values.devSnapshot.enabled }}
{{- $name := printf "%s-dev-snapshot" (include "invenio.fullname" .) }}
{{- $secret := required "Missing .Values.devSnapshot.existingSecret" .Values.devSnapshot.existingSecret }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "invenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-snapshot
spec:
  schedule: {{ .Values.devSnapshot.schedule | quote }}
  suspend: {{ .Values.devSnapshot.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A failed verification would fail again; don't retry, let someone look.
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.devSnapshot.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "invenio.labels" . | nindent 12 }}
            app.kubernetes.io/component: dev-snapshot
        spec:
          restartPolicy: Never
          {{- with .Values.devSnapshot.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.devSnapshot.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.devSnapshot.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.devSnapshot.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: dev-snapshot
              image: {{ printf "%s/%s:%s" .Values.devSnapshot.image.registry (required "Missing .Values.devSnapshot.image.repository" .Values.devSnapshot.image.repository) (required "Missing .Values.devSnapshot.image.tag" .Values.devSnapshot.image.tag) | quote }}
              imagePullPolicy: {{ .Values.devSnapshot.image.pullPolicy | quote }}
              {{- with .Values.devSnapshot.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              env:
                - name: TZ
                  value: {{ required "Missing .Values.global.timezone" .Values.global.timezone }}
                - name: WORK_DIR
                  value: /work
                - name: APP_IMAGE
                  value: {{ default (include "invenio.image" .) .Values.web.image | quote }}
                - name: S3_ENDPOINT_URL
                  value: {{ required "Missing .Values.devSnapshot.s3.endpointUrl" .Values.devSnapshot.s3.endpointUrl | quote }}
                - name: S3_BUCKET
                  value: {{ required "Missing .Values.devSnapshot.s3.bucket" .Values.devSnapshot.s3.bucket | quote }}
                - name: S3_REGION
                  value: {{ .Values.devSnapshot.s3.region | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.devSnapshot.s3.prefix | quote }}
                # The staging database connection, as the app and the import job get it.
                {{- include "invenio.config.database" . | nindent 16 }}
                {{- range $env, $key := dict
                      "SNAPSHOT_SALT" .Values.devSnapshot.secretKeys.salt
                      "S3_ACCESS_KEY_ID" .Values.devSnapshot.secretKeys.s3AccessKeyId
                      "S3_SECRET_ACCESS_KEY" .Values.devSnapshot.secretKeys.s3SecretAccessKey }}
                - name: {{ $env }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secret }}
                      key: {{ $key }}
                {{- end }}
              {{- with .Values.devSnapshot.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            # Holds the scratch database (raw staging data) and the dump; deleted
            # together with the pod.
            - name: work
              {{- if .Values.devSnapshot.work.storageClass }}
              ephemeral:
                volumeClaimTemplate:
                  metadata:
                    labels:
                      {{- include "invenio.labels" . | nindent 22 }}
                      app.kubernetes.io/component: dev-snapshot
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    storageClassName: {{ .Values.devSnapshot.work.storageClass | quote }}
                    resources:
                      requests:
                        storage: {{ .Values.devSnapshot.work.size }}
              {{- else }}
              emptyDir:
                sizeLimit: {{ .Values.devSnapshot.work.size }}
              {{- end }}
            - name: tmp
              emptyDir:
                sizeLimit: 100Mi
{{- end }}
